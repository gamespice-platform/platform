[plugin]

name="gs-platform"
description="Joins gs-auth, gs-user and gs-user-avatar into one admission flow, and binds it to a gs-server as a module. Turns the family from a set of addons into a platform a player can sign into, own a profile on, and appear in."
author="dot"
version="0.1.0"
script="gs_platform_plugin.gd"
